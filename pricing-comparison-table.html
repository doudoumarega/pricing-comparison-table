<!DOCTYPE html>
<html lang="en">
	<head>
	  <meta charset="UTF-8">
	  <meta name="viewport" content="width=device-width, initial-scale=1">
	  <meta name="description" content="Small pricing comparison page.">
	  <title>Pricing Comparison Table</title>
	</head>

	<body>
		<header>
			<!-- Site identity and navigation -->

			<h1>Acme Plans</h1>
			<nav>
				<a href="Home.html" >Home</a>

		<main>

						<th scope="row">Business</th>

						<td>Unlimited</td>

					<tr>
